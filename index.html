 addEventListener('pointermove',e=>{const r=logo.getBoundingClientRect();mx=e.clientX-(r.left+r.width/2);my=e.clientY-(r.top+r.height*.47);lastMove=performance.now()/1000});
 logo.addEventListener('click',e=>{e.stopPropagation();mode='surprise';lidT=0;tx=0;ty=0;setTimeout(()=>mode='look',900)});
 const looks=[[-6,0],[6,0],[0,0],[-5,-4],[5,-4],[0,4],[6,3],[-6,3]];
 (function tick(){const t=performance.now()/1000;
   if(t-lastMove<1.6){const d=Math.hypot(mx,my)||1,k=Math.min(6.2,d/30);tx=mx/d*k;ty=my/d*k}
   else if(t>next){const l=looks[(Math.random()*looks.length)|0];tx=l[0];ty=l[1];next=t+.6+Math.random()*2.2}
   x+=(tx-x)*.18;y+=(ty-y)*.18;pu.setAttribute('transform',`translate(${x.toFixed(2)},${y.toFixed(2)})`);
   if(mode==='surprise'){lidT=0;pu.setAttribute('transform',`translate(${x.toFixed(2)},${y.toFixed(2)}) translate(34 31) scale(.6) translate(-34 -31)`)}
   else if(t<sleepUntil){lidT=Math.min(1,lidT+.04)}
   else if(t>blinkAt){const ph=(t-blinkAt)/.18;lidT=ph<1?Math.sin(ph*Math.PI):0;if(ph>=1){const r=Math.random();blinkAt=t+(r<.12?.25:1.8+Math.random()*3.5);if(r>.94)sleepUntil=t+2.2+Math.random()*1.5}}
   else lidT=Math.max(0,lidT-.06);
   lidH=30*lidT;lid.setAttribute('height',lidH.toFixed(2));lash.setAttribute('opacity',lidT>.92?1:0);
   requestAnimationFrame(tick)})()}
const clock=new THREE.Clock();
function place(list,anchorUp){const boxes=[];for(const l of list){l.obj.getWorldPosition(tmp);tmp.y+=(l.dy||0)*(l.obj.parent&&l.obj.parent.scale?l.obj.parent.scale.x:1);const n=tmp.project(cam);
  if(n.z>1||Math.abs(n.x)>1.05||Math.abs(n.y)>1.05){l.el.style.visibility='hidden';continue}l.el.style.visibility='visible';
  let x=(n.x+1)/2*innerWidth+(l.dx||0),y=(1-n.y)/2*innerHeight;const w=l.w||(l.w=l.el.offsetWidth),h=l.h||(l.h=l.el.offsetHeight);
  if(anchorUp){x-=w*(l.sx<0?.85:l.sx>0?.15:.5);y-=h}else{y-=h/2}
  for(let k=0;k<20&&boxes.some(b=>x<b.x+b.w&&x+w>b.x&&y<b.y+b.h&&y+h>b.y);k++)y+=h*.6;boxes.push({x,y,w,h});l.el.style.transform=`translate(${x}px,${y}px)`}return boxes}
function frame(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  cam.position.set(CAM.x+mouse.x*1.4,CAM.y+mouse.y*.8,CAM.z);cam.lookAt(0,3.5,0);
  look.set(mouse.x*14,3.5+mouse.y*8,10);
  for(const e of eyes){e.w.getWorldPosition(tmp);const s=e.w.parent.scale.x,c=tmp.clone();tmp.copy(look).sub(c).normalize().multiplyScalar(e.r*s*.62);e.p.position.copy(c).add(tmp);e.p.scale.setScalar(s);
    const bl=Math.sin(t*.9+c.x)>.985;e.p.scale.y=bl?.1*s:s}
  for(const f of anim)f(t);
  if(state==='hang')piano.rotation.z=Math.sin(t*1.1)*.05;
  if(state==='fall'){vy-=22*dt;piano.position.y+=vy*dt;piano.rotation.z*=.95;if(piano.position.y-2.4*piano.scale.x<=floorY)smash()}
  if(state==='smashed'){tState+=dt;for(const s of shards){s.v.y-=18*dt;s.m.position.addScaledVector(s.v,dt);s.m.rotation.x+=s.w.x*dt;s.m.rotation.y+=s.w.y*dt;
      if(s.m.position.y<floorY){s.m.position.y=floorY;s.v.y*=-.3;s.v.x*=.7;s.v.z*=.7;s.w.multiplyScalar(.6)}}
    if(tState>5.5){reveal.classList.remove('on');shards.forEach(s=>s.m.scale.multiplyScalar(.93))}
    if(tState>7){shards.forEach(s=>{world.remove(s.m);s.m.geometry.dispose()});shards=[];state='lower';piano.visible=true;rope.visible=true;piano.position.y=hand.y+8}}
  if(state==='lower'){piano.position.y+=(hand.y-piano.position.y)*Math.min(1,dt*3);rope.visible=piano.position.y-hand.y<.05;if(Math.abs(piano.position.y-hand.y)<.01){piano.position.y=hand.y;state='hang'}}
  Rn.render(S,cam);
  if(vibe&&vibe.obj){vibe.obj.getWorldPosition(tmp);tmp.y+=1.9*vibe.obj.parent.scale.x;tmp.project(cam);const w=vibe.el.offsetWidth;
    vibe.el.style.transform=`translate(${Math.max(8,(tmp.x+1)/2*innerWidth-w+28)}px,${(1-tmp.y)/2*innerHeight-vibe.el.offsetHeight}px)`;vibe.el.style.visibility=Math.abs(tmp.x)>1.05||Math.abs(tmp.y)>1.05?'hidden':'visible'}
  if(innerWidth>700){place(labels,true);place([...ideaEls,...fossilEls],false)}
  requestAnimationFrame(frame)}
frame();
window.__drop=()=>{state='fall';vy=0;rope.visible=false};
</script>
